name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions: {}

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
      actions: read
    env:
      SIGN: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' && github.ref_type == 'tag' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73
        with:
          global-json-file: helper/global.json
      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress
      - name: Version
        id: version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq 'tag') { $version = $env:GITHUB_REF_NAME.TrimStart('v') }
          else { $version = ([xml](Get-Content helper/Directory.Build.props)).Project.PropertyGroup.Version + "-dev.$env:GITHUB_RUN_NUMBER" }
          "value=$version" >> $env:GITHUB_OUTPUT
      - name: Build the binaries
        shell: pwsh
        run: ./scripts/build-release.ps1 -Version '${{ steps.version.outputs.value }}' -Phase Binaries
      - name: Upload the unsigned binaries
        if: env.SIGN == 'true'
        id: unsigned-binaries
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: unsigned-binaries-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/unsigned/*.exe
          if-no-files-found: error
      - name: Sign the binaries (SignPath)
        if: env.SIGN == 'true'
        uses: signpath/github-action-submit-signing-request@4a84eb4ad763290f059275786f2deed97c2c672b
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: binaries
          github-artifact-id: ${{ steps.unsigned-binaries.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 7200
          output-artifact-directory: artifacts/signed-binaries
          parameters: |
            version: ${{ toJSON(steps.version.outputs.value) }}
      - name: Build the archive and the installer
        shell: pwsh
        env:
          STELLARIA_SIGNING_KEY: ${{ secrets.STELLARIA_SIGNING_KEY }}
        run: |
          $signed = if ($env:SIGN -eq 'true') { 'artifacts/signed-binaries' } else { '' }
          ./scripts/build-release.ps1 -Version '${{ steps.version.outputs.value }}' -Phase Package -SignedBinaries $signed
      - name: Upload the unsigned installer
        if: env.SIGN == 'true'
        id: unsigned-setup
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: unsigned-setup-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/StellariaSetup-*.exe
          if-no-files-found: error
      - name: Sign the installer (SignPath)
        if: env.SIGN == 'true'
        uses: signpath/github-action-submit-signing-request@4a84eb4ad763290f059275786f2deed97c2c672b
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: installer
          github-artifact-id: ${{ steps.unsigned-setup.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 7200
          output-artifact-directory: artifacts/signed-setup
          parameters: |
            version: ${{ toJSON(steps.version.outputs.value) }}
      - name: Update manifest and checksums
        shell: pwsh
        env:
          STELLARIA_SIGNING_KEY: ${{ secrets.STELLARIA_SIGNING_KEY }}
        run: |
          $signed = if ($env:SIGN -eq 'true') { 'artifacts/signed-setup' } else { '' }
          ./scripts/build-release.ps1 -Version '${{ steps.version.outputs.value }}' -Phase Finish -SignedSetup $signed
      - name: Check the signatures
        if: env.SIGN == 'true'
        shell: pwsh
        run: |
          foreach ($file in (Get-ChildItem artifacts/stage/bin/*.exe) + (Get-Item artifacts/stage/pack/native/StellariaSwitcher.exe) + (Get-ChildItem artifacts/StellariaSetup-*.exe)) {
            $signature = Get-AuthenticodeSignature $file.FullName
            "$($file.Name): $($signature.Status) $($signature.SignerCertificate.Subject)"
            if ($signature.Status -ne 'Valid') { throw "$($file.Name) is not signed." }
          }
      - name: Check native dependencies
        shell: pwsh
        run: |
          $dumpbin = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -find 'VC\Tools\MSVC\**\bin\Hostx64\x64\dumpbin.exe' | Select-Object -First 1
          foreach ($file in 'artifacts/stage/bin/stellaria-helper.exe', 'artifacts/stage/bin/e_sqlite3.dll', 'artifacts/stage/bin/stellaria-launcher.exe') {
            $imports = & $dumpbin /nologo /dependents $file | Select-String '\.dll' | ForEach-Object { $_.Line.Trim() }
            $imports
            if ($imports -match '(?i)^(vcruntime|msvcp)') { throw "$file needs the Visual C++ runtime." }
          }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: stellaria-${{ steps.version.outputs.value }}
          path: |
            artifacts/*.exe
            artifacts/*.zip
            artifacts/SHA256SUMS.txt
            artifacts/update.json
            artifacts/update.json.minisig
          if-no-files-found: error

  publish:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          path: release
          merge-multiple: true
      - name: Verify checksums
        working-directory: release
        run: sha256sum --check SHA256SUMS.txt
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-path: |
            release/*.exe
            release/*.zip
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          path: source
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          SIGNED: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
        run: |
          signed=""
          if [ "$SIGNED" = "true" ]; then signed="--signed"; fi
          python3 source/scripts/release-notes.py --tag "$TAG" --repo "$GITHUB_REPOSITORY" $signed             --setup "release/StellariaSetup-${TAG#v}.exe" --archive "release/Stellaria-${TAG#v}-portable.zip" --output notes.md
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft --verify-tag --notes-file notes.md --title "Stellaria ${TAG#v}" release/*
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false
